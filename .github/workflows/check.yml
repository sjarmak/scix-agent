# Generated by ~/.claude/guardrails, specialized for scix's DB-backed suite.
# The gate is `make check`; scix needs a Postgres service (pgvector) loaded
# from ci/scix_test_schema.sql so integration tests have a real schema DB.
# CI runs the DB-less + schema-backed subset via PYTEST_ARGS marker filter;
# data-dependent tests are marked `integration`/`network` and deselected (they
# need the live corpus, which CI does not have). Install pulls the lightweight
# runtime extras (qdrant/graph/mcp) so the core retrieval, graph, and MCP unit
# tests run; heavy model/viz deps (torch, umap, fastapi) are intentionally NOT
# installed and their test modules self-skip via tests/conftest.py.
name: check
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scix
          POSTGRES_PASSWORD: scix
          POSTGRES_DB: scix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCIX_TEST_DSN: "host=localhost port=5432 user=scix password=scix dbname=scix_test"
      SCIX_DSN: "host=localhost port=5432 user=scix password=scix dbname=scix_test"
      PYTEST_ARGS: '-m "not integration and not network"'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: pip install -e '.[dev,qdrant,graph,mcp]'
      - name: Load schema
        run: psql "$SCIX_TEST_DSN" -v ON_ERROR_STOP=1 -f ci/scix_test_schema.sql
      - name: make check
        run: make check
